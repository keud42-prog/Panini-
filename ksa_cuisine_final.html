<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KSA — Écran Cuisine</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --v: #7C3AED; --r: #E91E8C; --dark: #0D0D1A; --orange: #FF6B00; --green: #00C853; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Barlow', sans-serif; background: #0D0D1A; color: white; display: flex; flex-direction: column; }

.conn-bar { padding: 5px 16px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; }
.conn-bar.connected { background: rgba(0,200,83,0.1); color: #00C853; }
.conn-bar.disconnected { background: rgba(233,30,140,0.1); color: var(--r); }
.conn-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.connected .conn-dot { background: #00C853; animation: pulse 1.5s infinite; }
.disconnected .conn-dot { background: var(--r); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.header { background: #111120; border-bottom: 2px solid rgba(255,255,255,0.07); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px; letter-spacing: 2px; }
.logo .k { color: var(--r); } .logo .s { color: var(--v); }
.logo small { font-size: 9px; letter-spacing: 3px; color: rgba(255,255,255,0.3); display: block; }
.header-center { text-align: center; }
.header-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; text-transform: uppercase; letter-spacing: 3px; color: rgba(255,255,255,0.5); }
.live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #00C853; font-weight: 700; margin-top: 4px; }
.dot { width: 8px; height: 8px; background: #00C853; border-radius: 50%; animation: pulse 1.5s infinite; }
.header-right { display: flex; align-items: center; gap: 14px; }
.btn-hist { background: rgba(124,58,237,0.15); color: #b78cff; border: 1px solid rgba(124,58,237,0.4); border-radius: 10px; padding: 8px 14px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
.btn-hist:hover { background: rgba(124,58,237,0.3); }
.time { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 28px; }
.date { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 2px; text-align: right; }

.stats-bar { background: #111120; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 20px; display: flex; flex-shrink: 0; }
.stat-item { flex: 1; text-align: center; border-right: 1px solid rgba(255,255,255,0.07); padding: 4px 0; }
.stat-item:last-child { border-right: none; }
.stat-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 26px; line-height: 1; }
.stat-num.a { color: var(--orange); }
.stat-num.r { color: #00C853; }
.stat-num.s { color: var(--v); }
.stat-num.t { color: rgba(255,255,255,0.4); }
.stat-lbl { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-top: 2px; }

.columns { display: grid; grid-template-columns: 1fr 1fr; flex: 1; overflow: hidden; }
.col { display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.06); overflow: hidden; }
.col:last-child { border-right: none; }
.col-hdr { padding: 10px 14px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.col-hdr.a { background: rgba(255,107,0,0.1); border-bottom: 2px solid var(--orange); }
.col-hdr.r { background: rgba(0,200,83,0.07); border-bottom: 2px solid #00C853; }
.col-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: 2px; }
.col-title.a { color: var(--orange); }
.col-title.r { color: #00C853; }
.col-count { margin-left: auto; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; color: rgba(255,255,255,0.5); }
.col-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.col-body::-webkit-scrollbar { display: none; }

.cmd-card { background: #16161e; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.07); }
.cmd-card.urgent { border-color: rgba(255,107,0,0.6); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{border-color:rgba(255,107,0,0.3)} 50%{border-color:rgba(255,107,0,0.9)} }
.cmd-top { padding: 10px 12px 8px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
.cmd-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 34px; line-height: 1; }
.cmd-num.a { color: var(--orange); }
.cmd-num.r { color: #00C853; }
.cmd-paid { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #00C853; background: rgba(0,200,83,0.15); padding: 2px 7px; border-radius: 20px; margin-left: 8px; vertical-align: middle; }
.cmd-time { font-size: 11px; color: rgba(255,255,255,0.35); font-weight: 600; }
.cmd-timer { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; margin-top: 2px; }
.cmd-timer.ok { color: #00C853; }
.cmd-timer.warn { color: #FFD600; }
.cmd-timer.late { color: var(--r); animation: blink2 1s infinite; }
@keyframes blink2 { 0%,100%{opacity:1} 50%{opacity:0.4} }
.cmd-items { padding: 8px 12px; }
.cmd-item { display: flex; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.04); gap: 6px; }
.cmd-item:last-child { border-bottom: none; }
.cmd-item-qty { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; color: var(--r); min-width: 22px; }
.cmd-item-name { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.8); flex: 1; }
.cmd-total { padding: 6px 12px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; color: rgba(255,255,255,0.55); border-top: 1px solid rgba(255,255,255,0.05); }
.cmd-actions { padding: 8px 10px; display: flex; gap: 6px; }
.btn { flex: 1; border-radius: 8px; padding: 10px 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase; transition: background 0.15s; border: 1px solid transparent; }
.btn-accept { background: rgba(0,200,83,0.14); color: #00C853; border-color: rgba(0,200,83,0.35); }
.btn-accept:hover { background: rgba(0,200,83,0.28); }
.btn-serve { background: rgba(124,58,237,0.16); color: #b78cff; border-color: rgba(124,58,237,0.4); }
.btn-serve:hover { background: rgba(124,58,237,0.3); }
.btn-back { background: rgba(255,214,0,0.12); color: #FFD600; border-color: rgba(255,214,0,0.3); flex: 0 0 auto; padding: 10px 12px; }
.btn-back:hover { background: rgba(255,214,0,0.22); }
.btn-edit { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.1); flex: 0 0 auto; padding: 10px 12px; }
.btn-edit:hover { background: rgba(255,255,255,0.12); }
.btn-cancel { background: rgba(233,30,140,0.1); color: var(--r); border-color: rgba(233,30,140,0.3); flex: 0 0 auto; padding: 10px 12px; }
.btn-cancel:hover { background: rgba(233,30,140,0.2); }

.col-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: rgba(255,255,255,0.12); text-align: center; padding: 20px; }
.col-empty p { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; line-height: 1.8; }

/* ---- Overlays (historique + modification) ---- */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
.overlay.show { display: flex; }
.modal { background: #16161e; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; width: 100%; max-width: 520px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-hdr { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
.modal-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; }
.modal-close { background: rgba(255,255,255,0.08); border: none; color: white; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.modal-body { padding: 16px 20px; overflow-y: auto; }
.modal-foot { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; gap: 10px; align-items: center; }

/* Historique */
.hist-item { background: #1c1c26; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.hist-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px; color: var(--v); }
.hist-info { flex: 1; font-size: 12px; color: rgba(255,255,255,0.6); }
.hist-info b { color: rgba(255,255,255,0.9); font-size: 13px; }
.hist-restore { background: rgba(255,214,0,0.12); color: #FFD600; border: 1px solid rgba(255,214,0,0.3); border-radius: 8px; padding: 8px 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase; }
.hist-empty { text-align: center; color: rgba(255,255,255,0.25); padding: 30px; font-weight: 600; }

/* Édition d'articles */
.edit-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.edit-name { flex: 1; font-size: 14px; font-weight: 600; }
.edit-price { font-size: 12px; color: rgba(255,255,255,0.4); }
.qty-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: white; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.qty-btn:hover { background: rgba(255,255,255,0.14); }
.qty-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; min-width: 26px; text-align: center; }
.edit-del { background: none; border: none; color: var(--r); font-size: 18px; cursor: pointer; padding: 4px 8px; }
.btn-add-item { width: 100%; margin-top: 12px; background: rgba(0,200,83,0.1); color: #00C853; border: 1px dashed rgba(0,200,83,0.4); border-radius: 10px; padding: 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; text-transform: uppercase; cursor: pointer; }
.edit-total { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 24px; margin-right: auto; }
.btn-save { background: var(--green); color: white; border: none; border-radius: 10px; padding: 12px 22px; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
.btn-modal-cancel { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); border: none; border-radius: 10px; padding: 12px 18px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; text-transform: uppercase; cursor: pointer; }

.new-notif { position: fixed; top: 0; left: 0; right: 0; background: var(--orange); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 400; transform: translateY(-100%); transition: transform 0.35s; }
.new-notif.show { transform: translateY(0); }
.nn-left { display: flex; align-items: center; gap: 12px; }
.nn-icon { font-size: 28px; }
.nn-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 20px; text-transform: uppercase; }
.nn-items { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 2px; }
.nn-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 48px; color: white; }
</style>
</head>
<body>

<div class="conn-bar disconnected" id="conn-bar"><div class="conn-dot"></div><span id="conn-text">Connexion au serveur...</span></div>

<div class="header">
  <div class="logo"><span class="k">K</span><span class="s">S</span>A<small>Alimentation</small></div>
  <div class="header-center">
    <div class="header-title">🍳 Écran Cuisine</div>
    <div class="live-dot"><div class="dot"></div> En direct</div>
  </div>
  <div class="header-right">
    <button class="btn-hist" onclick="openHistory()">🕓 Historique</button>
    <div><div class="time" id="clock">--:--</div><div class="date" id="date-lbl">—</div></div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-num a" id="cnt-a">0</div><div class="stat-lbl">À accepter</div></div>
  <div class="stat-item"><div class="stat-num r" id="cnt-r">0</div><div class="stat-lbl">Prêt</div></div>
  <div class="stat-item"><div class="stat-num s" id="cnt-s">0</div><div class="stat-lbl">Servies</div></div>
  <div class="stat-item"><div class="stat-num t" id="cnt-t">0</div><div class="stat-lbl">Aujourd'hui</div></div>
</div>

<div class="columns">
  <div class="col">
    <div class="col-hdr a"><span>⏳</span><div class="col-title a">À accepter</div><span class="col-count" id="cc-a">0</span></div>
    <div class="col-body" id="col-a"></div>
  </div>
  <div class="col">
    <div class="col-hdr r"><span>✅</span><div class="col-title r">Prêt à servir</div><span class="col-count" id="cc-r">0</span></div>
    <div class="col-body" id="col-r"></div>
  </div>
</div>

<!-- Overlay historique -->
<div class="overlay" id="ov-hist">
  <div class="modal">
    <div class="modal-hdr"><div class="modal-title">🕓 Commandes servies aujourd'hui</div><button class="modal-close" onclick="closeOverlay('ov-hist')">✕</button></div>
    <div class="modal-body" id="hist-body"></div>
  </div>
</div>

<!-- Overlay modification -->
<div class="overlay" id="ov-edit">
  <div class="modal">
    <div class="modal-hdr"><div class="modal-title" id="edit-title">✏️ Modifier la commande</div><button class="modal-close" onclick="closeOverlay('ov-edit')">✕</button></div>
    <div class="modal-body" id="edit-body"></div>
    <div class="modal-foot">
      <div class="edit-total" id="edit-total">0,00€</div>
      <button class="btn-modal-cancel" onclick="closeOverlay('ov-edit')">Annuler</button>
      <button class="btn-save" onclick="saveEdit()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="new-notif" id="new-notif">
  <div class="nn-left"><div class="nn-icon">🔔</div><div><div class="nn-title">Nouvelle commande !</div><div class="nn-items" id="nn-items">—</div></div></div>
  <div class="nn-num" id="nn-num">—</div>
</div>

<script>
let orders = [];     // commandes actives (attente / pret)
let history = [];    // commandes servies aujourd'hui
let totalToday = 0;
let ws = null;
let editing = null;  // { id, items:[...] } pendant la modification
let lastMsg = Date.now();
let pingTimer = null;

function fmt(n){ return (Number(n)||0).toFixed(2).replace('.',',') + '€'; }

function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('date-lbl').textContent = now.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
}
setInterval(updateClock,1000); updateClock();

// Timers des cartes
setInterval(() => {
  orders.forEach(o => {
    const el = document.getElementById('t-'+o.id);
    if(!el) return;
    const mins = Math.floor((Date.now()-o.createdAt)/60000);
    const secs = Math.floor(((Date.now()-o.createdAt)%60000)/1000);
    el.textContent = mins+':'+String(secs).padStart(2,'0');
    el.className = 'cmd-timer ' + (mins<5?'ok':mins<10?'warn':'late');
  });
}, 1000);

function connect(){
  const wsProtocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(wsProtocol + location.host);
  ws.onopen = () => { document.getElementById('conn-bar').className='conn-bar connected'; document.getElementById('conn-text').textContent='Connecté — Commandes en direct'; lastMsg=Date.now(); clearInterval(pingTimer); pingTimer=setInterval(()=>{ if(ws&&ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({type:'PING'})); }, 25000); };
  ws.onclose = () => { clearInterval(pingTimer); document.getElementById('conn-bar').className='conn-bar disconnected'; document.getElementById('conn-text').textContent='Déconnecté — Reconnexion...'; setTimeout(connect,3000); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    lastMsg = Date.now();
    if(msg.type === 'PONG') return;
    if(msg.type === 'INIT'){
      orders = msg.orders || [];
      history = msg.history || [];
      totalToday = msg.totalToday || 0;
      renderAll();
    }
    else if(msg.type === 'NEW_ORDER'){
      orders.push(msg.order);
      totalToday = msg.totalToday;
      renderAll();
      showNotif(msg.order);
    }
    else if(msg.type === 'UPDATE_STATUS'){
      const o = orders.find(x => x.id === msg.id);
      if(o){ o.status = msg.status; renderAll(); }
    }
    else if(msg.type === 'EDIT_ORDER'){
      const o = orders.find(x => x.id === msg.id);
      if(o){ o.items = msg.items; o.total = msg.total; renderAll(); }
    }
    else if(msg.type === 'SERVE_ORDER'){
      orders = orders.filter(x => x.id !== msg.id);
      history.unshift(msg.order);
      renderAll();
    }
    else if(msg.type === 'RESTORE_ORDER'){
      history = history.filter(x => x.id !== msg.order.id);
      orders.push(msg.order);
      renderAll();
    }
    else if(msg.type === 'DELETE_ORDER'){
      orders = orders.filter(x => x.id !== msg.id);
      renderAll();
    }
    else if(msg.type === 'ENCAISSE'){
      const o = orders.find(x => x.id === msg.id);
      if(o){ o.paid = true; renderAll(); }
    }
  };
}
connect();

// Chien de garde : si plus aucun signal du serveur depuis 60s, on force la reconnexion
setInterval(() => {
  if(ws && ws.readyState === WebSocket.OPEN && Date.now() - lastMsg > 60000){
    try { ws.close(); } catch(e) {}
  }
}, 10000);

function send(obj){ if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

// --- Actions ---
function accepter(id){ send({type:'UPDATE_STATUS', id, status:'pret'}); }
function retour(id){ send({type:'UPDATE_STATUS', id, status:'attente'}); }
function servi(id){ send({type:'SERVE_ORDER', id}); }
function annuler(id){ if(confirm('Annuler cette commande ?')) send({type:'DELETE_ORDER', id}); }
function restaurer(id){ send({type:'RESTORE_ORDER', id}); closeOverlay('ov-hist'); }

// --- Rendu principal ---
function renderAll(){
  const a = orders.filter(o => o.status === 'attente');
  const r = orders.filter(o => o.status === 'pret');
  document.getElementById('cnt-a').textContent = a.length;
  document.getElementById('cnt-r').textContent = r.length;
  document.getElementById('cnt-s').textContent = history.length;
  document.getElementById('cnt-t').textContent = totalToday;
  document.getElementById('cc-a').textContent = a.length;
  document.getElementById('cc-r').textContent = r.length;
  renderCol('col-a', a, 'attente');
  renderCol('col-r', r, 'pret');
  if(document.getElementById('ov-hist').classList.contains('show')) renderHistory();
}

function renderCol(colId, list, status){
  const col = document.getElementById(colId);
  if(list.length === 0){
    const msg = status==='attente' ? '⏳<br/>Aucune commande<br/>à accepter' : '🎉<br/>Rien à servir<br/>pour l\'instant';
    col.innerHTML = '<div class="col-empty"><p>'+msg+'</p></div>';
    return;
  }
  col.innerHTML = list.map(o => {
    const urgent = (Date.now()-o.createdAt) > 600000;
    const cls = status==='attente' ? 'a' : 'r';
    const paidBadge = o.paid ? '<span class="cmd-paid">Payé</span>' : '';
    let actions;
    if(status==='attente'){
      actions = '<div class="cmd-actions">'
        + '<button class="btn btn-accept" onclick="accepter('+o.id+')">✅ Accepter</button>'
        + '<button class="btn btn-edit" onclick="openEdit('+o.id+')">✏️</button>'
        + '<button class="btn btn-cancel" onclick="annuler('+o.id+')">✕</button>'
        + '</div>';
    } else {
      actions = '<div class="cmd-actions">'
        + '<button class="btn btn-serve" onclick="servi('+o.id+')">🎉 Servi</button>'
        + '<button class="btn btn-back" onclick="retour('+o.id+')">↩️</button>'
        + '<button class="btn btn-edit" onclick="openEdit('+o.id+')">✏️</button>'
        + '</div>';
    }
    return '<div class="cmd-card '+(urgent?'urgent':'')+'">'
      + '<div class="cmd-top">'
      +   '<div class="cmd-num '+cls+'">'+o.num+paidBadge+'</div>'
      +   '<div style="text-align:right"><div class="cmd-time">'+new Date(o.createdAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</div><div class="cmd-timer ok" id="t-'+o.id+'">0:00</div></div>'
      + '</div>'
      + '<div class="cmd-items">'+o.items.map(i => '<div class="cmd-item"><div class="cmd-item-qty">'+(i.qty>0?i.qty+'x':'')+'</div><div class="cmd-item-name">'+i.name+'</div></div>').join('')+'</div>'
      + '<div class="cmd-total">Total : '+fmt(o.total)+'</div>'
      + actions
      + '</div>';
  }).join('');
}

// --- Historique ---
function openHistory(){ renderHistory(); document.getElementById('ov-hist').classList.add('show'); }
function renderHistory(){
  const body = document.getElementById('hist-body');
  if(history.length === 0){ body.innerHTML = '<div class="hist-empty">Aucune commande servie pour l\'instant</div>'; return; }
  body.innerHTML = history.map(o => {
    const t = o.servedAt ? new Date(o.servedAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '';
    const paid = o.paid ? ' · <span style="color:#00C853">payé</span>' : ' · <span style="color:#FF6B00">non payé</span>';
    return '<div class="hist-item">'
      + '<div class="hist-num">#'+o.num+'</div>'
      + '<div class="hist-info"><b>'+fmt(o.total)+'</b> · '+o.items.length+' article'+(o.items.length>1?'s':'')+' · servi '+t+paid+'</div>'
      + '<button class="hist-restore" onclick="restaurer('+o.id+')">↩️ Restaurer</button>'
      + '</div>';
  }).join('');
}

// --- Modification des articles ---
function openEdit(id){
  const o = orders.find(x => x.id === id);
  if(!o) return;
  editing = { id, items: JSON.parse(JSON.stringify(o.items)) }; // copie
  document.getElementById('edit-title').textContent = '✏️ Modifier la commande #' + o.num;
  renderEdit();
  document.getElementById('ov-edit').classList.add('show');
}
function renderEdit(){
  const body = document.getElementById('edit-body');
  body.innerHTML = editing.items.map((i, idx) =>
    '<div class="edit-item">'
    + '<button class="qty-btn" onclick="editQty('+idx+',-1)">−</button>'
    + '<div class="qty-val">'+i.qty+'</div>'
    + '<button class="qty-btn" onclick="editQty('+idx+',1)">+</button>'
    + '<div class="edit-name">'+i.name+'<div class="edit-price">'+fmt(i.price)+' / unité</div></div>'
    + '<button class="edit-del" onclick="editRemove('+idx+')">🗑️</button>'
    + '</div>'
  ).join('') + '<button class="btn-add-item" onclick="editAdd()">＋ Ajouter un article</button>';
  const total = editing.items.reduce((s,i)=> s + (Number(i.price)||0)*(Number(i.qty)||0), 0);
  document.getElementById('edit-total').textContent = fmt(total);
}
function editQty(idx, delta){
  editing.items[idx].qty = Math.max(1, (editing.items[idx].qty||1) + delta);
  renderEdit();
}
function editRemove(idx){ editing.items.splice(idx,1); renderEdit(); }
function editAdd(){
  const name = prompt('Nom de l\'article ?');
  if(!name) return;
  const priceStr = prompt('Prix unitaire (€) ?', '0');
  const price = parseFloat((priceStr||'0').replace(',','.')) || 0;
  editing.items.push({ name, price, qty: 1 });
  renderEdit();
}
function saveEdit(){
  if(!editing) return;
  send({ type:'EDIT_ORDER', id: editing.id, items: editing.items });
  closeOverlay('ov-edit');
  editing = null;
}

function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }

function showNotif(order){
  document.getElementById('nn-num').textContent = '#' + order.num;
  document.getElementById('nn-items').textContent = order.items.slice(0,2).map(i => i.qty+'x '+i.name).join(' · ') + (order.items.length>2 ? ' +'+(order.items.length-2) : '');
  const el = document.getElementById('new-notif');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}
</script>
