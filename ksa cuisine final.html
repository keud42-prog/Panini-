<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KSA — Écran Cuisine</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --v: #7C3AED; --r: #E91E8C; --dark: #0D0D1A; --orange: #FF6B00; --green: #00C853; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Barlow', sans-serif; background: #0D0D1A; color: white; display: flex; flex-direction: column; }

.conn-bar { padding: 5px 16px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; }
.conn-bar.connected { background: rgba(0,200,83,0.1); color: #00C853; }
.conn-bar.disconnected { background: rgba(233,30,140,0.1); color: var(--r); }
.conn-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.connected .conn-dot { background: #00C853; animation: pulse 1.5s infinite; }
.disconnected .conn-dot { background: var(--r); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.header { background: #111120; border-bottom: 2px solid rgba(255,255,255,0.07); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px; letter-spacing: 2px; }
.logo .k { color: var(--r); } .logo .s { color: var(--v); }
.logo small { font-size: 9px; letter-spacing: 3px; color: rgba(255,255,255,0.3); display: block; }
.header-center { text-align: center; }
.header-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; text-transform: uppercase; letter-spacing: 3px; color: rgba(255,255,255,0.5); }
.live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #00C853; font-weight: 700; margin-top: 4px; }
.dot { width: 8px; height: 8px; background: #00C853; border-radius: 50%; animation: pulse 1.5s infinite; }
.time { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 28px; }
.date { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 2px; text-align: right; }

.stats-bar { background: #111120; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 20px; display: flex; gap: 0; flex-shrink: 0; }
.stat-item { flex: 1; text-align: center; border-right: 1px solid rgba(255,255,255,0.07); padding: 4px 0; }
.stat-item:last-child { border-right: none; }
.stat-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 26px; line-height: 1; }
.stat-num.a { color: var(--orange); }
.stat-num.p { color: #FFD600; }
.stat-num.r { color: #00C853; }
.stat-num.t { color: rgba(255,255,255,0.4); }
.stat-lbl { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-top: 2px; }

.columns { display: grid; grid-template-columns: 1fr 1fr 1fr; flex: 1; overflow: hidden; }
.col { display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.06); overflow: hidden; }
.col:last-child { border-right: none; }
.col-hdr { padding: 10px 14px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.col-hdr.a { background: rgba(255,107,0,0.1); border-bottom: 2px solid var(--orange); }
.col-hdr.p { background: rgba(255,214,0,0.07); border-bottom: 2px solid #FFD600; }
.col-hdr.r { background: rgba(0,200,83,0.07); border-bottom: 2px solid #00C853; }
.col-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: 2px; }
.col-title.a { color: var(--orange); }
.col-title.p { color: #FFD600; }
.col-title.r { color: #00C853; }
.col-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.col-body::-webkit-scrollbar { display: none; }

.cmd-card { background: #16161e; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.07); transition: all 0.2s; }
.cmd-card.urgent { border-color: rgba(255,107,0,0.6); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{border-color:rgba(255,107,0,0.3)} 50%{border-color:rgba(255,107,0,0.9)} }
.cmd-top { padding: 10px 12px 8px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
.cmd-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 38px; line-height: 1; }
.cmd-num.a { color: var(--orange); }
.cmd-num.p { color: #FFD600; }
.cmd-num.r { color: #00C853; }
.cmd-time { font-size: 11px; color: rgba(255,255,255,0.35); font-weight: 600; }
.cmd-timer { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; margin-top: 2px; }
.cmd-timer.ok { color: #00C853; }
.cmd-timer.warn { color: #FFD600; }
.cmd-timer.late { color: var(--r); animation: blink2 1s infinite; }
@keyframes blink2 { 0%,100%{opacity:1} 50%{opacity:0.4} }
.cmd-items { padding: 8px 12px; }
.cmd-item { display: flex; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.04); gap: 6px; }
.cmd-item:last-child { border-bottom: none; }
.cmd-item-qty { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; color: var(--r); min-width: 22px; }
.cmd-item-name { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.8); }
.cmd-actions { padding: 8px 10px; display: flex; gap: 6px; }
.btn-prep { flex: 1; background: rgba(255,214,0,0.12); color: #FFD600; border: 1px solid rgba(255,214,0,0.3); border-radius: 8px; padding: 9px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase; transition: background 0.2s; }
.btn-prep:hover { background: rgba(255,214,0,0.22); }
.btn-pret { flex: 1; background: rgba(0,200,83,0.12); color: #00C853; border: 1px solid rgba(0,200,83,0.3); border-radius: 8px; padding: 9px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase; transition: background 0.2s; }
.btn-pret:hover { background: rgba(0,200,83,0.22); }
.btn-done { flex: 1; background: rgba(124,58,237,0.12); color: var(--v); border: 1px solid rgba(124,58,237,0.3); border-radius: 8px; padding: 9px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase; transition: background 0.2s; }
.btn-done:hover { background: rgba(124,58,237,0.25); }
.btn-del { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 9px 10px; cursor: pointer; font-size: 14px; }

.col-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: rgba(255,255,255,0.12); text-align: center; padding: 20px; }
.col-empty .em { font-size: 36px; margin-bottom: 8px; display: block; }
.col-empty p { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

.new-notif { position: fixed; top: 0; left: 0; right: 0; background: var(--orange); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 200; transform: translateY(-100%); transition: transform 0.35s; }
.new-notif.show { transform: translateY(0); }
.nn-left { display: flex; align-items: center; gap: 12px; }
.nn-icon { font-size: 28px; }
.nn-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 20px; text-transform: uppercase; }
.nn-items { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 2px; }
.nn-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 48px; color: white; }
</style>
</head>
<body>

<div class="conn-bar disconnected" id="conn-bar">
  <div class="conn-dot"></div>
  <span id="conn-text">Connexion au serveur...</span>
</div>

<div class="header">
  <div class="logo"><span class="k">K</span><span class="s">S</span>A<small>Alimentation</small></div>
  <div class="header-center">
    <div class="header-title">🍳 Écran Cuisine</div>
    <div class="live-dot"><div class="dot"></div> En direct</div>
  </div>
  <div>
    <div class="time" id="clock">--:--</div>
    <div class="date" id="date-lbl">—</div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-num a" id="cnt-a">0</div><div class="stat-lbl">En attente</div></div>
  <div class="stat-item"><div class="stat-num p" id="cnt-p">0</div><div class="stat-lbl">En prépa</div></div>
  <div class="stat-item"><div class="stat-num r" id="cnt-r">0</div><div class="stat-lbl">Prêt</div></div>
  <div class="stat-item"><div class="stat-num t" id="cnt-t">0</div><div class="stat-lbl">Aujourd'hui</div></div>
</div>

<div class="columns" style="flex:1;overflow:hidden;display:grid;grid-template-columns:1fr 1fr 1fr;">

  <div class="col">
    <div class="col-hdr a"><span>⏳</span><div class="col-title a">En attente</div></div>
    <div class="col-body" id="col-a"></div>
  </div>

  <div class="col">
    <div class="col-hdr p"><span>👨‍🍳</span><div class="col-title p">En préparation</div></div>
    <div class="col-body" id="col-p"></div>
  </div>

  <div class="col">
    <div class="col-hdr r"><span>✅</span><div class="col-title r">Prêt à servir</div></div>
    <div class="col-body" id="col-r"></div>
  </div>

</div>

<div class="new-notif" id="new-notif">
  <div class="nn-left">
    <div class="nn-icon">🔔</div>
    <div><div class="nn-title">Nouvelle commande !</div><div class="nn-items" id="nn-items">—</div></div>
  </div>
  <div class="nn-num" id="nn-num">—</div>
</div>

<script>
let orders = [];
let totalToday = 0;
let ws = null;

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('date-lbl').textContent = now.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
}
setInterval(updateClock, 1000);
updateClock();

setInterval(() => {
  orders.forEach(o => {
    const el = document.getElementById('t-' + o.id);
    if (!el) return;
    const mins = Math.floor((Date.now() - o.createdAt) / 60000);
    const secs = Math.floor(((Date.now() - o.createdAt) % 60000) / 1000);
    el.textContent = mins + ':' + String(secs).padStart(2,'0');
    el.className = 'cmd-timer ' + (mins < 5 ? 'ok' : mins < 10 ? 'warn' : 'late');
  });
}, 1000);

function connect() {
  ws = new WebSocket('ws://' + location.host);

  ws.onopen = () => {
    document.getElementById('conn-bar').className = 'conn-bar connected';
    document.getElementById('conn-text').textContent = 'Connecté — Commandes en direct';
  };

  ws.onclose = () => {
    document.getElementById('conn-bar').className = 'conn-bar disconnected';
    document.getElementById('conn-text').textContent = 'Déconnecté — Reconnexion...';
    setTimeout(connect, 3000);
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'INIT') {
      orders = msg.orders;
      totalToday = msg.totalToday;
      renderAll();
    }
    else if (msg.type === 'NEW_ORDER') {
      orders.push(msg.order);
      totalToday = msg.totalToday;
      renderAll();
      showNotif(msg.order);
    }
    else if (msg.type === 'UPDATE_STATUS') {
      const o = orders.find(x => x.id === msg.id);
      if (o) { o.status = msg.status; renderAll(); }
    }
    else if (msg.type === 'DELETE_ORDER') {
      orders = orders.filter(x => x.id !== msg.id);
      renderAll();
    }
  };
}
connect();

function moveOrder(id, status) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'UPDATE_STATUS', id, status }));
  }
}

function deleteOrder(id) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'DELETE_ORDER', id }));
  }
}

function renderAll() {
  const a = orders.filter(o => o.status === 'attente');
  const p = orders.filter(o => o.status === 'prep');
  const r = orders.filter(o => o.status === 'pret');
  document.getElementById('cnt-a').textContent = a.length;
  document.getElementById('cnt-p').textContent = p.length;
  document.getElementById('cnt-r').textContent = r.length;
  document.getElementById('cnt-t').textContent = totalToday;
  renderCol('col-a', a, 'a');
  renderCol('col-p', p, 'p');
  renderCol('col-r', r, 'r');
}

function renderCol(colId, list, status) {
  const col = document.getElementById(colId);
  if (list.length === 0) {
    const msgs = { a:'⏳<br/>Aucune commande<br/>en attente', p:'🍳<br/>Rien en<br/>préparation', r:'🎉<br/>Aucune<br/>commande prête' };
    col.innerHTML = `<div class="col-empty"><p>${msgs[status]}</p></div>`;
    return;
  }
  col.innerHTML = list.map(o => {
    const urgent = (Date.now() - o.createdAt) > 600000;
    let actions = '';
    if (status === 'a') {
      actions = `<div class="cmd-actions"><button class="btn-prep" onclick="moveOrder(${o.id},'prep')">👨‍🍳 Préparer</button><button class="btn-del" onclick="deleteOrder(${o.id})">✕</button></div>`;
    } else if (status === 'p') {
      actions = `<div class="cmd-actions"><button class="btn-pret" onclick="moveOrder(${o.id},'pret')">✅ Prêt !</button><button class="btn-del" onclick="deleteOrder(${o.id})">✕</button></div>`;
    } else {
      actions = `<div class="cmd-actions"><button class="btn-done" onclick="deleteOrder(${o.id})">🎉 Servi — Terminer</button></div>`;
    }
    return `
      <div class="cmd-card ${urgent?'urgent':''}">
        <div class="cmd-top">
          <div class="cmd-num ${status}">${o.num}</div>
          <div style="text-align:right">
            <div class="cmd-time">${new Date(o.createdAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>
            <div class="cmd-timer ok" id="t-${o.id}">0:00</div>
          </div>
        </div>
        <div class="cmd-items">
          ${o.items.map(i => `<div class="cmd-item"><div class="cmd-item-qty">${i.qty}x</div><div class="cmd-item-name">${i.name}</div></div>`).join('')}
        </div>
        ${actions}
      </div>`;
  }).join('');
}

function showNotif(order) {
  document.getElementById('nn-num').textContent = '#' + order.num;
  document.getElementById('nn-items').textContent = order.items.slice(0,2).map(i => i.qty+'x '+i.name).join(' · ') + (order.items.length > 2 ? ' +' + (order.items.length-2) : '');
  const el = document.getElementById('new-notif');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}
</script>
</body>
</html>
